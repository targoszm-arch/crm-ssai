name: Deploy Supabase functions

# Edge functions were deployed by hand until now, and the repo had drifted: five
# functions sat in main having never been deployed at all, including the website
# visitor tracker. This deploys what changed, on merge, so that cannot happen quietly.
#
# Migrations had the same gap until 2026-09-20 (SSAI lms-event-routing PR #52):
# merging a migration file only put SQL text into git — nothing ever ran it
# against the live database. lms_event_routes/route_lms_event had to be applied
# by hand after the fact, and lms-webhook's new code path (calling
# route_lms_event via rpc()) would otherwise have started failing in production
# the moment it deployed, since the function it calls wouldn't exist yet. The
# apply-migrations job below closes that gap the same way deploy already closed
# it for functions: push a migration, main applies it, no manual step.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names, comma-separated. Use "all" to deploy every function in the repo.'
        required: true
        default: all

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false # never interrupt a half-finished deploy

jobs:
  apply-migrations:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against

      - name: Detect changed migrations
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs only touch functions (see inputs above) — migrations
            # are push-triggered only, so nothing to apply here.
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'supabase/migrations/**')
          if [ -n "$changed" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed migrations:"
          echo "$changed"

      - uses: supabase/setup-cli@v1
        if: steps.detect.outputs.has_migrations == 'true'
        with:
          version: latest

      - name: Push migrations
        if: steps.detect.outputs.has_migrations == 'true'
        env:
          # Same secret and same project the functions deploy below uses — one
          # access token, no separate DB password needed for `db push`.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.GHACTIONSCRMSSAI }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret GHACTIONSCRMSSAI is empty or not set."
            echo "Add it under Settings > Secrets and variables > Actions (not Codespaces or Dependabot)."
            exit 1
          fi
          ref=$(grep '^project_id' supabase/config.toml | cut -d'"' -f2)
          supabase link --project-ref "$ref"
          supabase db push --include-all

  deploy:
    name: Deploy Supabase functions
    runs-on: ubuntu-latest
    # Migrations land before code that might call a function/table they add —
    # exactly the failure this job exists to prevent (lms-webhook calling
    # route_lms_event before it existed). needs: always waits for
    # apply-migrations to finish even when it has nothing to do (has_migrations
    # false is still a success), so function deploys are never blocked on a
    # migration-free push.
    needs: [apply-migrations]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to diff against

      - name: Work out which functions to deploy
        id: pick
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.functions }}" = "all" ]; then
              names=$(ls supabase/functions)
            else
              names=$(echo "${{ inputs.functions }}" | tr ',' '\n' | tr -d ' ')
            fi
          else
            changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'supabase/functions/**')
            names=$(echo "$changed" | cut -d/ -f3 | sort -u)

            # A change to shared code deploys nothing on its own, because no function
            # directory was touched — and the deployed functions would quietly keep the
            # old copy, since the CLI bundles the import at deploy time. So when shared
            # code moves, redeploy every function that imports it.
            shared=$(echo "$changed" | cut -d/ -f3 | sort -u | grep '^_' || true)
            for s in $shared; do
              importers=$(grep -rl "\.\./$s/" supabase/functions --include='*.ts' \
                          | cut -d/ -f3 | sort -u || true)
              names=$(printf '%s\n%s\n' "$names" "$importers" | sort -u)
            done
          fi

          # Drop the shared directories themselves. The CLI treats a leading underscore as
          # "shared code, not a function", and so must we: carrying `_shared` through as a
          # name fails the verify_jwt gate below on a config block that can never exist,
          # which would take the real functions in the same push down with it.
          filtered=""
          for n in $names; do
            case "$n" in
              _*) echo "Skipping shared directory: $n" ;;
              *)  filtered="$filtered $n" ;;
            esac
          done
          names=$(echo $filtered | tr ' ' '\n' | sort -u)

          missing=""
          for n in $names; do
            [ -d "supabase/functions/$n" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::No such function directory:$missing"
            exit 1
          fi

          echo "names<<EOF" >> "$GITHUB_OUTPUT"
          echo "$names" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Selected:" $names

      # The CLI defaults verify_jwt to true. Several functions here MUST be public —
      # tracking pixels, the Framer site's visitor beacon, inbound webhooks — and they
      # stay public only because config.toml says so. A function with no entry would be
      # silently deployed as authenticated and stop working, so require the decision to
      # be explicit rather than inherited from a default.
      - name: Require an explicit verify_jwt for every function being deployed
        run: |
          set -euo pipefail
          undeclared=""
          while read -r n; do
            [ -z "$n" ] && continue
            grep -q "^\[functions\.$n\]" supabase/config.toml || undeclared="$undeclared $n"
          done <<< "${{ steps.pick.outputs.names }}"
          if [ -n "$undeclared" ]; then
            echo "::error::No [functions.<name>] block in supabase/config.toml for:$undeclared"
            echo "Add one setting verify_jwt explicitly — true for functions called with a user session,"
            echo "false for tracking pixels, public beacons and inbound webhooks."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          # The CLI reads SUPABASE_ACCESS_TOKEN from the environment; the repository
          # secret holding it is named GHACTIONSCRMSSAI, matching the label on the
          # Supabase personal access token it came from.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.GHACTIONSCRMSSAI }}
        run: |
          set -euo pipefail
          # Fail with something readable rather than an opaque CLI auth error if the
          # secret is missing, renamed, or scoped to the wrong tab.
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret GHACTIONSCRMSSAI is empty or not set."
            echo "Add it under Settings > Secrets and variables > Actions (not Codespaces or Dependabot)."
            exit 1
          fi
          ref=$(grep '^project_id' supabase/config.toml | cut -d'"' -f2)
          failed=""
          while read -r n; do
            [ -z "$n" ] && continue
            echo "::group::$n"
            # No --no-verify-jwt flag: the CLI reads verify_jwt per function from config.toml,
            # which the step above has already proven is set for each of these.
            if supabase functions deploy "$n" --project-ref "$ref"; then
              echo "- \`$n\` deployed" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $n"
              echo "- \`$n\` **FAILED**" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done <<< "${{ steps.pick.outputs.names }}"

          # Deploy every function we can rather than stopping at the first failure,
          # then fail the job — a partial deploy you know about beats one you don't.
          if [ -n "$failed" ]; then
            echo "::error::Failed to deploy:$failed"
            exit 1
          fi
